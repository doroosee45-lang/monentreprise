version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: omdeve-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: omdeve
    networks:
      - omdeve-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omdeve-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/omdeve
      NODE_ENV: production
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - omdeve-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omdeve-client
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - omdeve-net

volumes:
  mongo_data:

networks:
  omdeve-net:
    driver: bridge
